<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - CREW_SOOM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h1>🔐 CREW_SOOM 로그인</h1>
        <p>침수 예측 AI 시스템에 로그인하세요</p>
    </div>

    <div class="container">
        <div class="login-form">
            <h2>시스템 로그인</h2>
            
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>
            
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="1234" required>
            </div>
            
            <button class="btn btn-success" onclick="login()" style="width: 100%;">
                🔑 로그인
            </button>
            
            <div style="margin-top: 20px; text-align: center;">
                <p><strong>기본 계정:</strong></p>
                <p>ID: admin / PW: 1234</p>
            </div>
            
            <div style="margin-top: 20px; text-align: center;">
                <a href="/" class="btn">← 메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert('아이디와 비밀번호를 입력하세요.');
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('✅ 로그인 성공!');
                    window.location.href = '/';
                } else {
                    alert('❌ ' + (result.message || '로그인 실패'));
                }
            } catch (error) {
                alert('❌ 로그인 중 오류가 발생했습니다: ' + error.message);
            }
        }
        
        // Enter 키 이벤트
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
