<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        h1 {
            border: 1px solid gray;
            background-color: aqua;
            margin-left: 440px;
            padding: 3px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            width: 20%;
            float: center;
        }
        button {
            margin: 30px auto;
            justify-content: center;
            display: flex;
            float: center;
            padding: 20px;
            border: 0;
            border-radius: 50%;
            color: red;
            background-color: aqua;
            font-weight: bold;
            font-size: 1.2em;
            
        }
    </style>
    <script>
        const whenClick = function() {
            alert('click했네');
            var h1 = document.querySelector('h1');
            h1.innerHTML = 'click 했구만';
            h1.style = 'color:red';
            h1.style.color = 'red';
        }
    </script>
</head>
<body>
    <h1 onclick="whenClick();">click해봐</h1>
</body>
</html>
