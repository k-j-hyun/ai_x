<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        table {
            text-align: center;
            margin: 0 auto;
            /* padding: 20px;             */
        }
        h3 {
            text-align: center;
        }
        table tr td {
            font-size : 1.3em;
            padding-bottom: 20px;
            line-height: normal;
        }
        div {
            width:300px; 
            margin:0 auto; 
            border:1px solid blue;             
        }
    </style>
    <script>
        const url = ['http://www.naver.com',
                'http://www.daum.net',
                'http://www.google.com',
                'http://www.youtube.com' ];

        function clicks(idx) {
            window.open(url[idx], '_blank');
        }
    </script>
</head>
<body>
    <div>
        <h3>                            
            quiz2. 메뉴
        </h3>        
        <form>            
            <table>
                <tr>
                    <td><button type="button" onclick="clicks(0);">네이버</button></td>
                    <td><button type="button" onclick="clicks(1);">다음</button></td>
                    <td><button type="button" onclick="clicks(2);">구글</button></td>
                    <td><button type="button" onclick="clicks(3);">유튜브</button></td>
                </tr>
            </table>            
        </form>
    </div>
</body>
</html>
