{% extends "base.html" %}

{% block title %}업로드 확인 페이지{% endblock %}

{% block content %}
<body onload="onload()">
<div class="container py-4"></div>
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold">업로드 성공</h1>
        <hr style="color:red"/>
        <img src="{{url_for('static', filename='img/check.png')}}" alt="check logo" width="90" />
        <p class="fs-3">{{ upload_fileneme }} 파일을 {{safe_filename}}에 저장하였습니다.</p>
        
        {% if file %}
            <p>파일이 성공적으로 업로드되었습니다: {{ file.filename }}</p>
        {% else %}
            <p>업로드된 파일이 없습니다.</p>
        {% endif %}
    </div>
    <script>
        function onload() {
            setTimeout(()=>{
                location.href='/';
            }, 5000);
        }
    </script>
</body>
{% endblock %}
